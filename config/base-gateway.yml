spring:
  cloud:
    gateway:
      server:
        webflux:
          # OAuth2 登录态必须中继到所有后端路由；控制面禁止删除该过滤器。
          default-filters:
            - TokenRelay=
          routes:
            - id: base-gateway-admin-api
              uri: lb://base-gateway-admin
              predicates:
                - Path=/api/gateway-admin/**
              filters:
                - StripPrefix=2
            - id: iqc-platform-api
              uri: lb://iqc-platform
              predicates:
                - Path=/api/iqc/**
            # 管理台 Knife4j 根路径文档入口，复用认证服务的 OpenAPI。
            - id: base-authorization-root-api-docs
              uri: lb://base-authorization
              predicates:
                - Path=/v3/**
            - id: base-authorization-api-docs
              uri: lb://base-authorization
              predicates:
                - Path=/oauth2/v3/**
              filters:
                - StripPrefix=2
            - id: base-authorization
              uri: lb://base-authorization
              predicates:
                - Path=/oauth2/**,/login,/logout,/assets/**,/webjars/**
            - id: base-authorization-api
              uri: lb://base-authorization
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2
            - id: base-organization
              uri: lb://base-organization
              predicates:
                - Path=/api/org/**
              filters:
                - StripPrefix=2
            - id: base-sysadmin
              uri: lb://base-sysadmin
              predicates:
                - Path=/api/sysadmin/**
              filters:
                - StripPrefix=2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://base-authorization:8000}
      client:
        provider:
          custom-issuer:
            issuer-uri: ${AUTH_ISSUER_URI:http://base-authorization:8000}
            user-info-uri: ${AUTH_ISSUER_URI:http://base-authorization:8000}/userinfo
            user-name-attribute: name
        registration:
          base-gateway-client:
            provider: custom-issuer
            client-name: 用户登陆
            client-id: ${GATEWAY_OAUTH_CLIENT_ID:test_client1}
            client-secret: ${GATEWAY_OAUTH_CLIENT_SECRET:test_client1}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: ${GATEWAY_REDIRECT_URI:http://opensabre:8080/login/oauth2/code/base-gateway-client}
            scope:
              - read
              - openid
              - profile
          base-gateway-local:
            provider: custom-issuer
            client-name: 本地用户登陆
            client-id: ${GATEWAY_LOCAL_OAUTH_CLIENT_ID:base-gateway-local}
            client-secret: ${GATEWAY_LOCAL_OAUTH_CLIENT_SECRET:base-gateway-local}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: ${GATEWAY_LOCAL_REDIRECT_URI:http://localhost:3000/login/oauth2/code/base-gateway-local}
            scope:
              - read
              - openid
              - profile
          iqc-platform-local:
            provider: custom-issuer
            client-name: IQC 本地前端
            client-id: ${IQC_GATEWAY_LOCAL_OAUTH_CLIENT_ID:iqc-platform-local}
            client-secret: ${IQC_GATEWAY_LOCAL_OAUTH_CLIENT_SECRET:base-gateway-local}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: ${IQC_GATEWAY_LOCAL_REDIRECT_URI:http://localhost:3010/login/oauth2/code/iqc-platform-local}
            scope:
              - read
              - openid
              - profile
          iqc-platform:
            provider: custom-issuer
            client-name: IQC 线上前端
            client-id: ${IQC_GATEWAY_ONLINE_OAUTH_CLIENT_ID:iqc-platform}
            client-secret: ${IQC_GATEWAY_ONLINE_OAUTH_CLIENT_SECRET:}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: ${IQC_GATEWAY_ONLINE_REDIRECT_URI:http://opensabre:3010/login/oauth2/code/iqc-platform}
            scope:
              - read
              - openid
              - profile
opensabre:
  gateway:
    # 网关白名单，无需要签权path
    permit:
      paths: /v3/**,/webjars/**,/assets/**,/doc.html,/favicon.ico,/oauth2/**,/api/sysadmin/captcha/send/image,/api/auth/logout
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
