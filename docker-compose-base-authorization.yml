services:
  base-authorization:
    image: ${BASE_AUTHORIZATION_IMAGE:-ccr.ccs.tencentyun.com/opensabre/base-authorization:latest}
    container_name: base-authorization
    restart: always
    ports:
      - "8000:8000"
    environment:
      HOME: ${CONTAINER_HOME:-/app}
      REGISTER_HOST: ${REGISTER_HOST:-rnacos}
      REGISTER_PORT: ${REGISTER_PORT:-8848}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      DATASOURCE_DBTYPE: ${DATASOURCE_DBTYPE:-mysql}
      DATASOURCE_HOST: ${DATASOURCE_HOST:-mysql}
      DATASOURCE_PORT: ${DATASOURCE_PORT:-3306}
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-opensabre}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-opensabre_change_me}
      RABBIT_MQ_HOST: ${RABBIT_MQ_HOST:-rabbitmq}
      RABBIT_MQ_PORT: ${RABBIT_MQ_PORT:-5672}
      RABBIT_MQ_USERNAME: ${RABBIT_MQ_USERNAME:-opensabre}
      RABBIT_MQ_PASSWORD: ${RABBIT_MQ_PASSWORD:-opensabre_change_me}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://base-authorization:8000}
      NACOS_DISCOVERY_IP: ${NACOS_DISCOVERY_IP:-}
    volumes:
      - ./config/bootstrap.yml:/app/bootstrap.yml:ro
      - ./config/application.yml:/app/config/application.yml:ro
      - ./logs/base-authorization:/app/logs
    networks:
      - opensabre

networks:
  opensabre:
    name: opensabre
    external: true
