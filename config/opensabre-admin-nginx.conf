user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  types_hash_max_size 2048;
  client_max_body_size 20m;

  upstream opensabre_backend {
    # 通过宿主机固定入口访问网关，避免容器重建后的 Docker IP 缓存导致 502。
    server opensabre:443 max_fails=3 fail_timeout=30s;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
  }

  gzip on;
  gzip_min_length 1k;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml+rss
    application/atom+xml
    image/svg+xml
    text/x-component
    application/x-font-ttf
    font/opentype;
  gzip_vary on;
  gzip_disable "msie6";
  gzip_proxied any;

  server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
      root /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    location ~* \.html$ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /doc.html {
      proxy_pass http://opensabre:443/doc.html;
      proxy_http_version 1.1;
      proxy_hide_header X-Frame-Options;
      add_header X-Frame-Options "SAMEORIGIN" always;
      proxy_set_header Host opensabre;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /webjars/ {
      proxy_pass http://opensabre_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location ^~ /v3/ {
      proxy_pass http://opensabre_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location / {
      root /usr/share/nginx/html;
      index index.html index.htm;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "healthy\n";
    }

    location = /favicon.ico {
      access_log off;
      log_not_found off;
      return 204;
    }

    location = /robots.txt {
      access_log off;
      return 200 "User-agent: *\nDisallow: /api/\nDisallow: /oauth2/\n";
    }

    location ~ ^/(api|oauth2|login/oauth2)/ {
      proxy_pass http://opensabre_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header Connection "";

      proxy_cookie_path / /;
      proxy_connect_timeout 30s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
      proxy_busy_buffers_size 8k;
      proxy_redirect off;
    }
  }
}
