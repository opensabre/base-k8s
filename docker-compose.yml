x-app-env: &app-env
  REGISTER_HOST: ${REGISTER_HOST:-rnacos}
  REGISTER_PORT: ${REGISTER_PORT:-8848}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  DATASOURCE_DBTYPE: ${DATASOURCE_DBTYPE:-mysql}
  DATASOURCE_HOST: ${DATASOURCE_HOST:-mysql}
  DATASOURCE_PORT: ${DATASOURCE_PORT:-3306}
  DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-opensabre}
  DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-opensabre_change_me}
  RABBIT_MQ_HOST: ${RABBIT_MQ_HOST:-rabbitmq}
  RABBIT_MQ_PORT: ${RABBIT_MQ_PORT:-5672}
  RABBIT_MQ_USERNAME: ${RABBIT_MQ_USERNAME:-opensabre}
  RABBIT_MQ_PASSWORD: ${RABBIT_MQ_PASSWORD:-opensabre_change_me}
  SENTINEL_DASHBOARD_HOST: ${SENTINEL_DASHBOARD_HOST:-sentinel-dashboard}
  SENTINEL_DASHBOARD_PORT: ${SENTINEL_DASHBOARD_PORT:-8858}
  AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://base-authorization:8000}
  GATEWAY_REDIRECT_URI: ${GATEWAY_REDIRECT_URI:-http://localhost:8443/login/oauth2/code/base-gateway-client}
  GATEWAY_OAUTH_CLIENT_ID: ${GATEWAY_OAUTH_CLIENT_ID:-test_client1}
  GATEWAY_OAUTH_CLIENT_SECRET: ${GATEWAY_OAUTH_CLIENT_SECRET:-test_client1}
  # 应用启动时向 base-sysadmin 注册错误码快照的共享鉴权令牌。
  ERROR_CATALOG_REGISTRATION_TOKEN: ${ERROR_CATALOG_REGISTRATION_TOKEN:-}
  NACOS_DISCOVERY_IP: ${NACOS_DISCOVERY_IP:-}
  HOME: ${CONTAINER_HOME:-/app}

x-app-volumes: &app-volumes
  - ./config/bootstrap.yml:/app/bootstrap.yml:ro
  - ./config/application.yml:/app/config/application.yml:ro

x-app-depends-on: &app-depends-on
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy
  rnacos:
    condition: service_started
  rabbitmq:
    condition: service_healthy

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: opensabre-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opensabre}
      MYSQL_USER: ${DATASOURCE_USERNAME:-opensabre}
      MYSQL_PASSWORD: ${DATASOURCE_PASSWORD:-opensabre_change_me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./initdb/10-opensabre-init.sh:/docker-entrypoint-initdb.d/10-opensabre-init.sh:ro
      - ./initdb/sql/base-authorization:/opt/opensabre/sql/base-authorization:ro
      - ./initdb/sql/base-organization:/opt/opensabre/sql/base-organization:ro
      - ./initdb/sql/base-sysadmin:/opt/opensabre/sql/base-sysadmin:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - opensabre

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: opensabre-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - opensabre

  rnacos:
    image: ${RNACOS_IMAGE:-qingpan/rnacos:stable}
    container_name: opensabre-rnacos
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
      - "10848:10848"
    volumes:
      - rnacos-data:/io
    networks:
      opensabre:
        aliases:
          - nacos

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13-management-alpine}
    container_name: opensabre-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-opensabre}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-opensabre_change_me}
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - opensabre

  sentinel-dashboard:
    image: ${SENTINEL_DASHBOARD_IMAGE:-bladex/sentinel-dashboard:1.8.8}
    container_name: opensabre-sentinel-dashboard
    restart: unless-stopped
    ports:
      - "8858:8858"
    networks:
      - opensabre

  base-authorization:
    image: ${BASE_AUTHORIZATION_IMAGE:-ccr.ccs.tencentyun.com/opensabre/base-authorization:latest}
    container_name: base-authorization
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVER_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./config/bootstrap.yml:/app/bootstrap.yml:ro
      - ./config/application.yml:/app/config/application.yml:ro
      - ./logs/base-authorization:/app/logs
    depends_on: *app-depends-on
    networks:
      opensabre:
        aliases:
          - authorization

  base-organization:
    image: ${BASE_ORGANIZATION_IMAGE:-ccr.ccs.tencentyun.com/opensabre/base-organization:latest}
    container_name: base-organization
    restart: unless-stopped
    environment:
      <<: *app-env
      # CI 镜像以非 root 用户运行，将 Nacos Client 日志写入已挂载的应用日志目录。
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--DJM.LOG.PATH=/app/logs}
      SERVER_PORT: 8010
    ports:
      - "8010:8010"
    volumes:
      - ./config/bootstrap.yml:/app/bootstrap.yml:ro
      - ./config/application.yml:/app/config/application.yml:ro
      - ./logs/base-organization:/app/logs
    depends_on: *app-depends-on
    networks:
      - opensabre

  base-sysadmin:
    image: ${BASE_SYSADMIN_IMAGE:-ccr.ccs.tencentyun.com/opensabre/base-sysadmin:latest}
    container_name: base-sysadmin
    restart: unless-stopped
    environment:
      <<: *app-env
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD:?JASYPT_ENCRYPTOR_PASSWORD is required}
      # CI 镜像以非 root 用户运行，将 Nacos Client 日志写入已挂载的应用日志目录。
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--DJM.LOG.PATH=/app/logs}
      SERVER_PORT: 8020
    ports:
      - "8020:8020"
    volumes:
      - ./config/bootstrap.yml:/app/bootstrap.yml:ro
      - ./config/application.yml:/app/config/application.yml:ro
      - ./logs/base-sysadmin:/app/logs
    depends_on: *app-depends-on
    networks:
      - opensabre

  base-gateway:
    image: ${BASE_GATEWAY_IMAGE:-ccr.ccs.tencentyun.com/opensabre/base-gateway:latest}
    container_name: base-gateway
    restart: unless-stopped
    environment:
      <<: *app-env
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD:?JASYPT_ENCRYPTOR_PASSWORD is required}
      SERVER_PORT: 8443
    ports:
      - "443:8443"
    extra_hosts:
      - "opensabre:10.0.10.4"
    volumes:
      - ./config/bootstrap.yml:/app/bootstrap.yml:ro
      - ./config/base-gateway-application.yml:/app/config/application.yml:ro
      - ./config/base-gateway.yml:/app/resources/base-gateway.yml:ro
      - ./logs/base-gateway:/app/logs
    depends_on:
      <<: *app-depends-on
      base-authorization:
        condition: service_started
      base-organization:
        condition: service_started
      base-sysadmin:
        condition: service_started
    networks:
      opensabre:
        aliases:
          - gateway

  opensabre-admin:
    image: ${OPENSABRE_ADMIN_IMAGE:-ccr.ccs.tencentyun.com/opensabre/opensabre-admin:master}
    container_name: opensabre-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./config/opensabre-admin-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      base-gateway:
        condition: service_started
    networks:
      - opensabre

networks:
  opensabre:
    name: opensabre
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rnacos-data:
  rabbitmq-data:
