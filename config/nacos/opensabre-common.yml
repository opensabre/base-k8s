# 跨服务、非敏感的运行配置。
# Nacos 连接信息、基础设施连接信息、密码和令牌仍保留在部署环境或 Secret 中。
spring:
  cloud:
    gateway:
      metrics:
        enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # 校验令牌签发方必须使用授权服务实际写入 JWT 的 issuer。
          # JWK 获取使用 Docker 服务名，不依赖外部 DNS。
          issuer-uri: ${AUTH_ISSUER_URI:http://opensabre:8000}
          jwk-set-uri: http://base-authorization:8000/oauth2/jwks
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
        spring.cloud.gateway.requests: 5ms
      maximum-expected-value:
        http.server.requests: 30s
        spring.cloud.gateway.requests: 30s
