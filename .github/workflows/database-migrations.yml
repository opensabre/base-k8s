name: database-migrations

on:
  pull_request:
  workflow_dispatch:

jobs:
  mysql-fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Remove after all service repositories adopt baseline/history/ddl/dml.
      ALLOW_LEGACY_FLYWAY_LAYOUT: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          path: base-k8s
      - uses: actions/checkout@v4
        with:
          repository: opensabre/base-authorization
          path: base-authorization
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: opensabre/base-organization
          path: base-organization
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: opensabre/base-sysadmin
          path: base-sysadmin
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: opensabre/base-gateway-admin
          path: base-gateway-admin
      - uses: actions/checkout@v4
        with:
          repository: opensabre/iqc-platform
          path: iqc-platform
      - name: Validate migration ownership and naming
        run: base-k8s/scripts/validate-flyway-migrations.sh "$GITHUB_WORKSPACE"
      - name: Validate release database targets
        run: base-k8s/scripts/validate-database-release-targets.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/base-k8s/releases/1.1.3-database-targets.env"
      - name: Migrate five isolated MySQL databases twice
        run: base-k8s/scripts/test-flyway-fresh-install.sh "$GITHUB_WORKSPACE"
      - name: Adopt and upgrade 0.6 and 0.7 database snapshots
        run: base-k8s/scripts/test-flyway-existing-upgrades.sh "$GITHUB_WORKSPACE"
