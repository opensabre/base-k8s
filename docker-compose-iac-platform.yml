services:
  iac-platform:
    image: ${IAC_PLATFORM_IMAGE:-ccr.ccs.tencentyun.com/opensabre/iac-platform:latest}
    container_name: iac-platform
    restart: unless-stopped
    mem_limit: ${IAC_PLATFORM_MEMORY_LIMIT:-1g}
    mem_reservation: ${IAC_PLATFORM_MEMORY_RESERVATION:-384m}
    ports:
      - "8050:8050"
      - "${IAC_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:18090:18090"
    environment:
      OPENSABRE_GOVERNANCE_REGISTRATIONTOKEN: ${GOVERNANCE_REGISTRATION_TOKEN:?GOVERNANCE_REGISTRATION_TOKEN is required}
      SERVER_PORT: 8050
      MANAGEMENT_SERVER_HOST: ${IAC_MANAGEMENT_HOST:-iac-platform}
      AUTH_JWK_SET_URI: ${AUTH_JWK_SET_URI:-http://base-authorization:8000/oauth2/jwks}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${AUTH_JWK_SET_URI:-http://base-authorization:8000/oauth2/jwks}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-18090}
      MANAGEMENT_SERVER_SSL_ENABLED: ${MANAGEMENT_SERVER_SSL_ENABLED:-false}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://base-authorization:8000}
      REGISTER_HOST: ${REGISTER_HOST:-rnacos}
      REGISTER_PORT: ${REGISTER_PORT:-8848}
      REGISTER_NAMESPACE: ${REGISTER_NAMESPACE:-}
      OPENSABRE_COMMON_CONFIG_DATA_ID: ${OPENSABRE_COMMON_CONFIG_DATA_ID:-opensabre-common.yml}
      OPENSABRE_COMMON_CONFIG_GROUP: ${OPENSABRE_COMMON_CONFIG_GROUP:-DEFAULT_GROUP}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      DATASOURCE_DBTYPE: ${DATASOURCE_DBTYPE:-mysql}
      DATASOURCE_HOST: ${DATASOURCE_HOST:-mysql}
      DATASOURCE_PORT: ${DATASOURCE_PORT:-3306}
      DATASOURCE_USERNAME: ${IAC_DATASOURCE_USERNAME:-iac_platform}
      DATASOURCE_PASSWORD: ${IAC_DATASOURCE_PASSWORD:?IAC_DATASOURCE_PASSWORD is required}
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD:?JASYPT_ENCRYPTOR_PASSWORD is required}
      SYSADMIN_SERVICE_ID: ${SYSADMIN_SERVICE_ID:-base-sysadmin}
      ORGANIZATION_SERVICE_ID: ${ORGANIZATION_SERVICE_ID:-base-organization}
      GOVERNANCE_USAGE_TRANSPORT: ${GOVERNANCE_USAGE_TRANSPORT:-EDA}
      GOVERNANCE_REGISTRATION_TOKEN: ${GOVERNANCE_REGISTRATION_TOKEN:-${ERROR_CATALOG_REGISTRATION_TOKEN:-}}
      ERROR_CATALOG_REGISTRATION_TOKEN: ${ERROR_CATALOG_REGISTRATION_TOKEN:-${GOVERNANCE_REGISTRATION_TOKEN:-}}
      DICTIONARY_REGISTRATION_TOKEN: ${DICTIONARY_REGISTRATION_TOKEN:-${GOVERNANCE_REGISTRATION_TOKEN:-}}
      RESOURCE_REGISTRATION_TOKEN: ${RESOURCE_REGISTRATION_TOKEN:-${GOVERNANCE_REGISTRATION_TOKEN:-}}
      DICTIONARY_REGISTRATION_ENABLED: ${DICTIONARY_REGISTRATION_ENABLED:-true}
      IAC_CONSUMER_ALLOWED_SERVICES: ${IAC_CONSUMER_ALLOWED_SERVICES:-iqc-platform}
      NACOS_DISCOVERY_IP: ${NACOS_DISCOVERY_IP:-}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--DJM.LOG.PATH=/app/logs -DJM.SNAPSHOT.PATH=/app/logs -Dcsp.sentinel.log.dir=/app/logs/csp}
    volumes:
      - ./logs/iac-platform:/app/logs
    networks:
      - opensabre

networks:
  opensabre:
    name: opensabre
    external: true
