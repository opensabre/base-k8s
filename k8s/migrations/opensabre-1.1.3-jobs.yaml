apiVersion: batch/v1
kind: Job
metadata:
  name: base-authorization-migration-1-1-3
  namespace: opensabre
  labels: {app.kubernetes.io/component: database-migration, app.kubernetes.io/version: 1.1.3}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: ccr.ccs.tencentyun.com/opensabre/base-authorization:1.1.3
          command: [java, -cp, "/app/resources:/app/classes:/app/libs/*", io.github.opensabre.migration.FlywayMigrationRunner]
          env:
            - {name: FLYWAY_DATABASE, value: os_base_auth}
            - {name: FLYWAY_TARGET, value: "20260823.06"}
            - {name: FLYWAY_URL, valueFrom: {secretKeyRef: {name: base-authorization-migration-db, key: url}}}
            - {name: FLYWAY_USER, valueFrom: {secretKeyRef: {name: base-authorization-migration-db, key: username}}}
            - {name: FLYWAY_PASSWORD, valueFrom: {secretKeyRef: {name: base-authorization-migration-db, key: password}}}
---
